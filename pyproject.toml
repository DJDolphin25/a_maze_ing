[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Perfect maze generator, BFS solver and hex serializer, reusable as a standalone package."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mazegen*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = ["^tests/"]
